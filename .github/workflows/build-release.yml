name: Build and release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: windows-2025-vs2026
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check version naming and calculate shared release version
        id: version
        shell: pwsh
        run: |
          ./Tests/ReleaseVersionChecks.ps1
          $release = ./scripts/Get-ReleaseVersion.ps1 -CommitSha $env:GITHUB_SHA
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT

  build:
    needs: version
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        flavor: [native, liquid-glass]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Calculate flavor artifact names
        id: names
        env:
          BUILD_FLAVOR: ${{ matrix.flavor }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $release = ./scripts/Get-ReleaseVersion.ps1 -CommitSha $env:GITHUB_SHA -Flavor $env:BUILD_FLAVOR
          if ($release.Version -ne $env:RELEASE_VERSION) { throw 'Build versions must match.' }
          "artifact_name=$($release.ArtifactName)" >> $env:GITHUB_OUTPUT
          "archive_name=$($release.ArchiveName)" >> $env:GITHUB_OUTPUT
      - name: Publish complete app and run hardware-free checks
        env:
          BUILD_FLAVOR: ${{ matrix.flavor }}
        run: |
          $arguments = @{ Checks=$true; BuildOnly=$true }
          if ($env:BUILD_FLAVOR -eq 'liquid-glass') { $arguments.LiquidGlass=$true }
          ./build-clean.ps1 @arguments
      - name: Package complete publish directory
        env:
          BUILD_FLAVOR: ${{ matrix.flavor }}
          ARCHIVE_NAME: ${{ steps.names.outputs.archive_name }}
        run: |
          New-Item -ItemType Directory -Path ./publish -Force | Out-Null
          $archive = Join-Path ./publish $env:ARCHIVE_NAME
          Compress-Archive -Path "./dist/$env:BUILD_FLAVOR/*" -DestinationPath $archive -CompressionLevel Optimal
          if ((Get-Item $archive).Length -gt 150MB) { throw 'Archive exceeds updater limit.' }
      - name: Upload validated build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: publish/${{ steps.names.outputs.archive_name }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  release:
    needs: [version, build]
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out checksum tooling from the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download both validated build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: YogaITS-${{ needs.version.outputs.version }}-*-x64
          merge-multiple: true
          path: release-assets
      - name: Publish one release containing both flavors
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $archives = @(
            (Join-Path ./release-assets "YogaITS-$env:RELEASE_VERSION-win-x64.zip"),
            (Join-Path ./release-assets "YogaITS-$env:RELEASE_VERSION-lg-win-x64.zip")
          )
          foreach ($archive in $archives) {
            if (-not (Test-Path -LiteralPath $archive)) { throw "Release archive is missing: $archive" }
          }
          if (@(Get-ChildItem ./release-assets -File -Filter '*.zip').Count -ne 2) { throw 'Expected exactly two archives.' }
          ./scripts/Write-Checksums.ps1 -Directory ./release-assets
          $checksums = Join-Path ./release-assets 'SHA256SUMS.txt'
          $assets = @($archives) + @($checksums)
          $notes = Join-Path $env:RUNNER_TEMP 'YogaITS-release-notes.md'
          @(
            'Independent, unofficial Windows x64 control center. Original releases: https://github.com/wfsg00098/YogaITS/releases',
            '',
            'Native: YogaITS.Tray.exe; requires a compatible system Windows App Runtime. Glass (-lg): YogaITS.Tray.exe; includes app-local Windows App SDK 2.2.0. Both require .NET 10 Desktop Runtime. Extract the entire selected ZIP into its own directory. Version timestamps use UTC commit time.',
            '',
            "Source commit: $env:GITHUB_SHA",
            "Build: https://github.com/$env:GH_REPO/actions/runs/$env:GITHUB_RUN_ID",
            '',
            'BSD-3-Clause; provided AS IS, without warranty or endorsement. Hardware/system operations carry risks. Third-party modifications and support promises are not certified or undertaken by the original authors. See LICENSE and NOTICE in the ZIP.',
            '',
            'Compare the downloaded ZIP with the matching SHA256SUMS.txt entry below or in the attached list. Each ZIP also contains a complete per-file list. Matching hashes establish byte consistency, not a safety guarantee or independent publisher signature.',
            '',
            '### SHA-256',
            '',
            '```text',
            (Get-Content -LiteralPath $checksums -Raw).TrimEnd(),
            '```'
          ) | Set-Content -LiteralPath $notes -Encoding utf8NoBOM
          $mainSha = gh api "repos/$env:GH_REPO/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to check current main.' }
          if ($mainSha -ne $env:GITHUB_SHA) {
            Write-Host 'A newer main commit exists; skip stale release publication.'
            exit 0
          }
          gh release view $env:RELEASE_VERSION --json tagName > $null 2> $null
          if ($LASTEXITCODE -eq 0) {
            $tagSha = gh api "repos/$env:GH_REPO/git/ref/tags/$env:RELEASE_VERSION" --jq '.object.sha'
            if ($LASTEXITCODE -ne 0 -or $tagSha -ne $env:GITHUB_SHA) { throw 'Existing release tag points elsewhere.' }
            gh release upload $env:RELEASE_VERSION @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
            # Update provenance/checksums without deleting existing generated notes.
            $existingNotes = gh release view $env:RELEASE_VERSION --json body --jq '.body'
            if ($LASTEXITCODE -ne 0) { throw 'Unable to read existing release notes.' }
            $generated = [regex]::Replace(($existingNotes -join "`n"), '(?s)<!-- yogaits-provenance:start -->.*?<!-- yogaits-provenance:end -->\s*', '').Trim()
            $provenance = "<!-- yogaits-provenance:start -->`n$([IO.File]::ReadAllText($notes))`n<!-- yogaits-provenance:end -->`n`n$generated"
            [IO.File]::WriteAllText($notes, $provenance, [Text.UTF8Encoding]::new($false))
            gh release edit $env:RELEASE_VERSION --notes-file $notes
          } else {
            $provenance = "<!-- yogaits-provenance:start -->`n$([IO.File]::ReadAllText($notes))`n<!-- yogaits-provenance:end -->"
            [IO.File]::WriteAllText($notes, $provenance, [Text.UTF8Encoding]::new($false))
            gh release create $env:RELEASE_VERSION @assets --latest=false --target $env:GITHUB_SHA --title $env:RELEASE_VERSION --generate-notes --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          $mainSha = gh api "repos/$env:GH_REPO/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to recheck current main.' }
          if ($mainSha -eq $env:GITHUB_SHA) {
            gh release edit $env:RELEASE_VERSION --latest
            if ($LASTEXITCODE -ne 0) { throw 'Unable to mark current release latest.' }
          }
